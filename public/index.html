<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0">
<title>Course Deliverables</title>
<style>
  :root {
    --bg: #0f1117;
    --col-bg: #181c26;
    --card-bg: #232937;
    --card-hover: #2b3245;
    --text: #e8eaf0;
    --muted: #8b93a7;
    --accent: #6c8cff;
    --todo: #6c8cff;
    --prog: #f5a623;
    --done: #3ecf8e;
    --radius: 12px;
  }
  * { box-sizing: border-box; margin: 0; padding: 0; -webkit-tap-highlight-color: transparent; }
  body {
    background: var(--bg);
    color: var(--text);
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
    min-height: 100vh;
    padding: 16px;
  }
  header {
    display: flex; align-items: center; justify-content: space-between;
    max-width: 1100px; margin: 0 auto 16px;
  }
  h1 { font-size: 20px; font-weight: 700; }
  h1 span { color: var(--accent); }
  #sync { font-size: 12px; color: var(--muted); }
  .add-bar {
    display: flex; gap: 8px; max-width: 1100px; margin: 0 auto 16px;
  }
  .add-bar input {
    flex: 1; background: var(--col-bg); border: 1px solid #2a3040; color: var(--text);
    border-radius: var(--radius); padding: 12px 14px; font-size: 15px; outline: none;
  }
  .add-bar input:focus { border-color: var(--accent); }
  .add-bar button {
    background: var(--accent); color: #fff; border: none; border-radius: var(--radius);
    padding: 0 20px; font-size: 15px; font-weight: 600; cursor: pointer;
  }
  .board {
    display: grid; grid-template-columns: repeat(3, 1fr); gap: 12px;
    max-width: 1100px; margin: 0 auto;
  }
  @media (max-width: 720px) {
    .board { grid-template-columns: 1fr; }
  }
  .col {
    background: var(--col-bg); border-radius: var(--radius); padding: 12px;
    min-height: 120px;
  }
  .col h2 {
    font-size: 13px; text-transform: uppercase; letter-spacing: 1px;
    margin-bottom: 10px; display: flex; align-items: center; gap: 8px;
  }
  .col h2 .count {
    background: var(--card-bg); border-radius: 10px; padding: 1px 8px;
    font-size: 12px; color: var(--muted);
  }
  .col[data-col="todo"] h2 { color: var(--todo); }
  .col[data-col="inprogress"] h2 { color: var(--prog); }
  .col[data-col="done"] h2 { color: var(--done); }
  .cards { min-height: 60px; display: flex; flex-direction: column; gap: 8px; }
  .card {
    background: var(--card-bg); border-radius: 10px; padding: 12px;
    font-size: 15px; line-height: 1.35; cursor: grab; user-select: none;
    display: flex; align-items: center; gap: 8px;
    border: 1px solid transparent;
  }
  .card:hover { background: var(--card-hover); }
  .card.dragging { opacity: 0.4; }
  .col.dragover .cards { outline: 2px dashed var(--accent); outline-offset: 4px; border-radius: 8px; }
  .card .txt { flex: 1; word-break: break-word; }
  .col[data-col="done"] .card .txt { text-decoration: line-through; color: var(--muted); }
  .card .btns { display: flex; gap: 4px; flex-shrink: 0; }
  .card button {
    background: #313952; color: var(--text); border: none; border-radius: 8px;
    width: 34px; height: 34px; font-size: 16px; cursor: pointer;
  }
  .card button:active { background: var(--accent); }
  .card button.del { background: transparent; color: var(--muted); font-size: 14px; }
  .empty { color: var(--muted); font-size: 13px; text-align: center; padding: 14px 0; }
  .card .txt { cursor: pointer; }
  .card .note-badge { font-size: 12px; color: var(--accent); margin-left: 6px; }
  .card .txt .preview { display: block; font-size: 12px; color: var(--muted); margin-top: 4px; font-weight: 400; white-space: pre-wrap; }
  /* notes modal */
  .overlay {
    position: fixed; inset: 0; background: rgba(0,0,0,0.6); backdrop-filter: blur(2px);
    display: none; align-items: center; justify-content: center; padding: 16px; z-index: 50;
  }
  .overlay.open { display: flex; }
  .modal {
    background: var(--col-bg); border: 1px solid #2a3040; border-radius: var(--radius);
    width: 100%; max-width: 560px; max-height: 90vh; display: flex; flex-direction: column;
    box-shadow: 0 20px 60px rgba(0,0,0,0.5);
  }
  .modal-head {
    padding: 16px 18px; border-bottom: 1px solid #2a3040; display: flex;
    align-items: flex-start; justify-content: space-between; gap: 12px;
  }
  .modal-head h3 { font-size: 16px; line-height: 1.35; font-weight: 700; }
  .modal-head .close {
    background: transparent; border: none; color: var(--muted); font-size: 22px;
    cursor: pointer; line-height: 1; flex-shrink: 0;
  }
  .modal-body { padding: 16px 18px; overflow-y: auto; }
  .modal-body label { font-size: 12px; text-transform: uppercase; letter-spacing: 1px; color: var(--muted); }
  .modal-body textarea {
    width: 100%; margin-top: 8px; min-height: 220px; resize: vertical;
    background: var(--card-bg); border: 1px solid #2a3040; color: var(--text);
    border-radius: 10px; padding: 12px 14px; font-size: 15px; line-height: 1.5;
    font-family: inherit; outline: none;
  }
  .modal-body textarea:focus { border-color: var(--accent); }
  .modal-foot { padding: 14px 18px; border-top: 1px solid #2a3040; display: flex; justify-content: flex-end; gap: 8px; }
  .modal-foot button { border: none; border-radius: 10px; padding: 10px 18px; font-size: 14px; font-weight: 600; cursor: pointer; }
  .modal-foot .cancel { background: #313952; color: var(--text); }
  .modal-foot .save { background: var(--accent); color: #fff; }
</style>
</head>
<body>
<header>
  <h1>🎬 Course <span>Deliverables</span></h1>
  <div id="sync">syncing…</div>
</header>

<div class="add-bar">
  <input id="newCard" type="text" placeholder="Add a deliverable…" autocomplete="off">
  <button onclick="addCard()">Add</button>
</div>

<div class="board">
  <div class="col" data-col="todo"><h2>📋 To Do <span class="count"></span></h2><div class="cards"></div></div>
  <div class="col" data-col="inprogress"><h2>⚡ In Progress <span class="count"></span></h2><div class="cards"></div></div>
  <div class="col" data-col="done"><h2>✅ Done <span class="count"></span></h2><div class="cards"></div></div>
</div>

<div class="overlay" id="overlay">
  <div class="modal">
    <div class="modal-head">
      <h3 id="modalTitle"></h3>
      <button class="close" onclick="closeNotes()">✕</button>
    </div>
    <div class="modal-body">
      <label>Notes</label>
      <textarea id="notesArea" placeholder="Add notes, links, scripts, ideas…"></textarea>
    </div>
    <div class="modal-foot">
      <button class="cancel" onclick="closeNotes()">Cancel</button>
      <button class="save" onclick="saveNotes()">Save</button>
    </div>
  </div>
</div>

<script>
const COLS = ['todo', 'inprogress', 'done'];
let board = { columns: { todo: [], inprogress: [], done: [] } };
let dirty = false;
let lastServerStamp = null;

function uid() { return Date.now().toString(36) + Math.random().toString(36).slice(2, 7); }

function render() {
  COLS.forEach(col => {
    const colEl = document.querySelector(`.col[data-col="${col}"]`);
    const wrap = colEl.querySelector('.cards');
    colEl.querySelector('.count').textContent = board.columns[col].length;
    wrap.innerHTML = '';
    if (!board.columns[col].length) {
      wrap.innerHTML = '<div class="empty">—</div>';
    }
    board.columns[col].forEach(card => {
      const el = document.createElement('div');
      el.className = 'card';
      el.draggable = true;
      el.dataset.id = card.id;

      const txt = document.createElement('div');
      txt.className = 'txt';
      const title = document.createElement('span');
      title.textContent = card.text;
      txt.appendChild(title);
      if (card.notes && card.notes.trim()) {
        const badge = document.createElement('span');
        badge.className = 'note-badge';
        badge.textContent = '📝';
        title.appendChild(badge);
        const prev = document.createElement('span');
        prev.className = 'preview';
        prev.textContent = card.notes.trim().slice(0, 140) + (card.notes.trim().length > 140 ? '…' : '');
        txt.appendChild(prev);
      }
      txt.title = 'Click to add/edit notes';
      txt.onclick = () => openNotes(card.id);
      el.appendChild(txt);

      const btns = document.createElement('div');
      btns.className = 'btns';
      const idx = COLS.indexOf(col);
      if (idx > 0) {
        const b = document.createElement('button');
        b.textContent = '←';
        b.onclick = () => moveCard(card.id, COLS[idx - 1]);
        btns.appendChild(b);
      }
      if (idx < COLS.length - 1) {
        const b = document.createElement('button');
        b.textContent = '→';
        b.onclick = () => moveCard(card.id, COLS[idx + 1]);
        btns.appendChild(b);
      }
      const del = document.createElement('button');
      del.className = 'del';
      del.textContent = '✕';
      del.onclick = () => { if (confirm('Delete "' + card.text + '"?')) deleteCard(card.id); };
      btns.appendChild(del);
      el.appendChild(btns);

      el.addEventListener('dragstart', e => {
        e.dataTransfer.setData('text/plain', card.id);
        el.classList.add('dragging');
      });
      el.addEventListener('dragend', () => el.classList.remove('dragging'));

      wrap.appendChild(el);
    });
  });
}

document.querySelectorAll('.col').forEach(colEl => {
  colEl.addEventListener('dragover', e => { e.preventDefault(); colEl.classList.add('dragover'); });
  colEl.addEventListener('dragleave', () => colEl.classList.remove('dragover'));
  colEl.addEventListener('drop', e => {
    e.preventDefault();
    colEl.classList.remove('dragover');
    moveCard(e.dataTransfer.getData('text/plain'), colEl.dataset.col);
  });
});

function findCard(id) {
  for (const col of COLS) {
    const i = board.columns[col].findIndex(c => c.id === id);
    if (i !== -1) return { col, i };
  }
  return null;
}

function moveCard(id, toCol) {
  const loc = findCard(id);
  if (!loc || loc.col === toCol) return;
  const [card] = board.columns[loc.col].splice(loc.i, 1);
  board.columns[toCol].push(card);
  dirty = true;
  render();
  push();
}

function deleteCard(id) {
  const loc = findCard(id);
  if (!loc) return;
  board.columns[loc.col].splice(loc.i, 1);
  dirty = true;
  render();
  push();
}

function addCard() {
  const inp = document.getElementById('newCard');
  const text = inp.value.trim();
  if (!text) return;
  board.columns.todo.push({ id: uid(), text });
  inp.value = '';
  dirty = true;
  render();
  push();
}
document.getElementById('newCard').addEventListener('keydown', e => { if (e.key === 'Enter') addCard(); });

let editingId = null;
function openNotes(id) {
  const loc = findCard(id);
  if (!loc) return;
  const card = board.columns[loc.col][loc.i];
  editingId = id;
  document.getElementById('modalTitle').textContent = card.text;
  document.getElementById('notesArea').value = card.notes || '';
  document.getElementById('overlay').classList.add('open');
  setTimeout(() => document.getElementById('notesArea').focus(), 50);
}
function closeNotes() {
  editingId = null;
  document.getElementById('overlay').classList.remove('open');
}
function saveNotes() {
  if (!editingId) return closeNotes();
  const loc = findCard(editingId);
  if (loc) {
    board.columns[loc.col][loc.i].notes = document.getElementById('notesArea').value;
    dirty = true;
    render();
    push();
  }
  closeNotes();
}
// close on overlay click (not modal) and Esc
document.getElementById('overlay').addEventListener('click', e => {
  if (e.target.id === 'overlay') closeNotes();
});
document.addEventListener('keydown', e => {
  if (e.key === 'Escape' && editingId) closeNotes();
  if (e.key === 'Enter' && (e.metaKey || e.ctrlKey) && editingId) saveNotes();
});

async function push() {
  try {
    const r = await fetch('/api/board', {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify(board),
    });
    if (r.ok) {
      const b = await r.json();
      lastServerStamp = b.updatedAt;
      dirty = false;
      setSync('saved');
    } else setSync('save error');
  } catch { setSync('offline'); }
}

async function pull() {
  if (dirty || editingId) return; // don't clobber unsaved local changes or an open notes editor
  try {
    const r = await fetch('/api/board');
    if (!r.ok) return;
    const b = await r.json();
    if (b.updatedAt !== lastServerStamp) {
      board = { columns: { todo: b.columns.todo || [], inprogress: b.columns.inprogress || [], done: b.columns.done || [] } };
      lastServerStamp = b.updatedAt;
      render();
    }
    setSync('live');
  } catch { setSync('offline'); }
}

function setSync(s) {
  document.getElementById('sync').textContent = s === 'live' ? '🟢 live' : s === 'saved' ? '🟢 saved' : '🔴 ' + s;
}

pull();
setInterval(pull, 4000);
</script>
</body>
</html>
